[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distroforge"
# Single source of truth: distroforge/__init__.py. The number also lives in
# debian/changelog, which dpkg owns and packaging.py cross-checks.
dynamic = ["version"]
description = "DistroForge builds and customizes Ubuntu/Debian live ISO images."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DistroForge maintainers" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Installation/Setup",
]
dependencies = [
  "pluggy>=1.5",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.5",
]
typer = [
  "typer>=0.12",
]
gui = [
  "PySide6>=6.7",
]
pyqt6 = [
  "PyQt6>=6.7",
]
all = [
  "mypy>=1.11",
  "pytest>=8.2",
  "ruff>=0.5",
  "typer>=0.12",
  "PySide6>=6.7",
]

[project.scripts]
distroforge = "distroforge.cli:main"
distroforge-typer = "distroforge.typer_cli:run"
distroforge-gui = "distroforge.ui.app:run"

[tool.setuptools.dynamic]
version = { attr = "distroforge.__version__" }

[tool.setuptools]
packages = [
  "distroforge",
  "distroforge.ai",
  "distroforge.commands",
  "distroforge.core",
  "distroforge.data",
  "distroforge.ui",
]

[tool.setuptools.package-data]
distroforge = ["data/*.toml", "data/vulndb.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# These are ini keys on purpose: pytest 9 ignores --strict-markers and
# --strict-config when they are passed through addopts, so putting them there
# would look like a guard and enforce nothing.
strict_markers = true
markers = [
  # A test that needs a path this user cannot write. Root has no such path: chmod
  # answers to ownership, so a 0500 directory is still writable by its owner and by
  # root, and the PermissionError these tests are about never happens. Declared here
  # because strict_markers is on, and skipped by tests/conftest.py.
  "unprivileged: requires a user who cannot write a mode-locked path",
]
strict_config = true
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  # Not an error: a leaked descriptor must be visible without failing an
  # unrelated test, and it is how the run_streaming leak surfaced.
  "default::ResourceWarning",
]

[tool.mypy]
# The floor of requires-python, not the interpreter that happens to be installed:
# the tarfile extraction filter and other defaults differ across 3.11 to 3.14.
python_version = "3.11"
ignore_missing_imports = true
# 209 of 250 modules are clean and stay clean. The 41 below are a debt list that
# only shrinks; ignore_errors is per-module, so a regression anywhere else fails.
# Entries were measured, not guessed -- see tests/test_typing_ratchet.py. Re-measured
# on 2026-07-26 by dropping each entry in turn and re-running: all 41 are still dirty,
# so none could be retired even after the ui/qt.py TYPE_CHECKING seam turned real
# checking on for distroforge.ui.main_window and its neighbours.
[[tool.mypy.overrides]]
ignore_errors = true
module = [
  "distroforge.ai.backend",
  "distroforge.ai.forgeadvisor",
  "distroforge.commands.beginner_iso",
  "distroforge.commands.doctor",
  "distroforge.commands.forgeadvisor",
  "distroforge.commands.profile",
  "distroforge.core.boot_proof",
  "distroforge.core.bootstrap",
  "distroforge.core.brand_identity",
  "distroforge.core.build_history",
  "distroforge.core.build_pipeline",
  "distroforge.core.capture",
  "distroforge.core.capture_diff",
  "distroforge.core.casper",
  "distroforge.core.customize",
  "distroforge.core.definition",
  "distroforge.core.demo_iso",
  "distroforge.core.derivative_profile",
  "distroforge.core.explain",
  "distroforge.core.html_report",
  "distroforge.core.interaction_plan",
  "distroforge.core.live_build",
  "distroforge.core.livefs_iso",
  "distroforge.core.policy",
  "distroforge.core.profile_resolver",
  "distroforge.core.publish_drill",
  "distroforge.core.publish_drill_diff",
  "distroforge.core.readiness",
  "distroforge.core.release_explain",
  "distroforge.core.release_notes",
  "distroforge.core.release_verification",
  "distroforge.core.rich_console",
  "distroforge.core.systemd_image",
  "distroforge.core.terminal",
  "distroforge.ui.build_controller",
  "distroforge.ui.build_options_mapper",
  "distroforge.ui.build_page",
  "distroforge.ui.cli_equivalent",
  "distroforge.ui.service_runner",
  "distroforge.ui.terminal_actions",
  "distroforge.ui.window_widgets",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Curated from the flake8-bandit family: only rules that fire on a real defect
# in this tree and leave no residual noise. S202 guards the archive extraction
# filter in distroforge/ui/path_actions.py. Measured on 2026-07-26: the whole
# S family reports 2050 findings, 2015 of them S101 (asserts in tests), and
# S310/S105/S311/S314 are false positives here (hardcoded https schemes, loop
# variables named token, palette shuffling, our own SVG).
extend-select = ["S202"]
ignore = ["E501"]
