# Deliberately offline. Every hook is `repo: local` with `language: system` or
# `language: pygrep`, which declares install_environment = no_install: nothing is
# cloned and no virtualenv is provisioned. A single `repo: https://` entry would
# clone on first run, and any `language: python` hook would pip-install, so this
# file would stop working on a machine without network and would violate the
# project's rule that nothing installs itself.
#
# The pygrep hooks are ratchets against defects this tree actually shipped. Each
# expression was checked to match the code before its fix and nothing after it.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # tools/*.sh is in scope alongside the packaging scripts: tools/release-tag.sh runs
      # on a maintainer's machine at release time, and the Makefile's shellcheck target
      # sweeps the same two sets, so a script added to either is checked by both gates.
      - id: shellcheck
        name: shellcheck (maintainer scripts and tools/*.sh)
        entry: shellcheck
        language: system
        files: ^(debian/(distroforge\.(postinst|preinst|prerm|postrm)|tests/(?!control$)[^/]+)|tools/[^/]+\.sh)$

      - id: maintainer-script-payloads
        name: "python3 payloads embedded in packaging scripts must compile"
        entry: python3 tools/check-maintainer-scripts.py .
        language: system
        pass_filenames: false
        files: ^(debian/(tests/.*|distroforge\..*)|tools/check-maintainer-scripts\.py)$

      - id: no-extend-or-append
        name: "list.extend returns None, so `or append` always fires"
        entry: '\.extend\([^)]*\)\s+or\s+\w+\.append'
        language: pygrep
        types: [python]

      - id: no-unfiltered-extractall
        name: "extractall without filter= follows symlinks out of the destination"
        entry: 'extractall\((?![^)]*filter=)'
        language: pygrep
        types: [python]

      - id: no-unversioned-iso-fallback
        name: "the ISO name comes from artifact_paths.default_output_iso"
        entry: '\{\s*(?:\w+\.)*name\s*\}\.iso'
        language: pygrep
        types: [python]
        exclude: ^distroforge/core/(artifact_paths|evidence)\.py$

      - id: no-inert-pytest-strictness
        name: "--strict-markers and --strict-config are inert inside addopts on pytest 9"
        entry: 'addopts.*--strict-(markers|config)'
        language: pygrep
        files: ^(pyproject\.toml|pytest\.ini|setup\.cfg|tox\.ini)$

      # The changelog is edited last, after the gate has already been run, which is
      # how a line of 81 characters reached CI and turned every job red for a
      # lintian tag. Its own policy tests now run when it changes, at commit time.
      - id: changelog-policy
        name: "the newest changelog entry obeys the packaging policy tests"
        entry: python3 -m pytest -q tests/test_policy_compliance.py -k changelog
        language: system
        pass_filenames: false
        files: ^debian/changelog$
