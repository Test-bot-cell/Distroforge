# The reference derivative: the one image this project builds for real, every week.
#
# It lives here, next to the workflow that consumes it, and deliberately not in
# examples/. Two reasons. Both shipped examples set qa.scenarios
# (examples/minimal-bootstrap.yaml:11, examples/developer-workstation.yaml:19) and that
# path cannot be used unattended: QaMatrixService builds its QemuInvocation without
# timeout_seconds (core/qa.py:52), so CommandRunner.run receives no timeout
# (core/command.py:118) and a guest that never reaches a login prompt hangs until the
# job's six-hour ceiling. And every choice below is a CI compromise -- disk budget,
# wall clock -- which is the opposite of what a shipped example should recommend.
# core/packaging.py:1013 would also report an undeclared examples/*.yaml as a policy
# finding, so putting it there would mean shipping these compromises to users.
#
# The bounded way to ask the same question qa.scenarios asks is `boot-proof`, which
# polls the serial log to a deadline (core/prebuild_vm.py:252) instead of waiting
# forever. The workflow runs it as a separate, asserted step.

# The whole point: build the rootfs from the archive rather than remaster an existing
# ISO. This is the single field that chooses between the two (core/build_sequence.py:99)
# and the reason no source ISO is needed (core/iso_doctor.py:90).
source_mode: bootstrap

# External trust policy for transaction zero. The keyring bytes are copied into the
# immutable build run before mmdebstrap is dispatched; the build then replays
# InRelease -> Packages -> every consumed .deb offline against only these full
# fingerprints. A key rotation must therefore be reviewed here rather than silently
# inherited from a runner image update.
bootstrap:
  archive_keyring: /usr/share/keyrings/ubuntu-archive-keyring.gpg
  archive_keyring_sha256: 80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31
  archive_signer_fingerprints:
    - F6ECB3762474EDA9D21B7022871920D1991BC93C
  # Each namespace owns its URI, suite, key bytes and freshness window.  Keeping
  # these separate prevents a valid signature for one Ubuntu pocket from
  # authorising an index captured from another.
  source_policies:
    - policy_id: ubuntu-release-resolute
      base_uri: https://archive.ubuntu.com/ubuntu
      suites: [resolute]
      codenames: [resolute]
      components: [main, restricted, universe, multiverse]
      architectures: [amd64]
      signer_fingerprints:
        - F6ECB3762474EDA9D21B7022871920D1991BC93C
      keyring_sha256:
        - 80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31
      max_release_age_seconds: 15552000
      max_future_skew_seconds: 300
      require_valid_until: false
    - policy_id: ubuntu-updates-resolute
      base_uri: https://archive.ubuntu.com/ubuntu
      suites: [resolute-updates, resolute-backports]
      codenames: [resolute]
      components: [main, restricted, universe, multiverse]
      architectures: [amd64]
      signer_fingerprints:
        - F6ECB3762474EDA9D21B7022871920D1991BC93C
      keyring_sha256:
        - 80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31
      max_release_age_seconds: 1209600
      max_future_skew_seconds: 300
      require_valid_until: false
    - policy_id: ubuntu-security-resolute
      base_uri: https://security.ubuntu.com/ubuntu
      suites: [resolute-security]
      codenames: [resolute]
      components: [main, restricted, universe, multiverse]
      architectures: [amd64]
      signer_fingerprints:
        - F6ECB3762474EDA9D21B7022871920D1991BC93C
      keyring_sha256:
        - 80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31
      max_release_age_seconds: 604800
      max_future_skew_seconds: 300
      require_valid_until: false

# Non-empty on purpose. An empty list leaves APPLY_PACKAGES with nothing to do, and
# that step is where apt runs inside the chroot -- a whole leg of the chain that a
# package-less definition never exercises. Two small ones: the binding constraint on a
# GitHub-hosted runner is disk, not CPU.
packages:
  - less
  - ca-certificates

# Measured on the 2.6 GB minbase rootfs of a real from-scratch build
# (docs/build-pipeline.md:105-110): zstd 37.1 s and 1466 MiB against the xz release
# default's 93.4 s and 1443 MiB -- 2.5x faster for 1.5% more image. lz4 is faster still
# (3.9 s) but 14.8% larger, and the point of a reference derivative is to resemble what
# a release build produces, not to take the fastest lab shortcut. lzma is refused
# before the build starts because no kernel can mount it (core/validate.py:462).
squashfs:
  compression: zstd

# No customization.desktop. The reason written here first was the disk budget, citing the
# 14 GB of SSD GitHub documents for a standard runner against the roughly 6 GB a rootfs,
# its squashfs and the ISO come to, and core/preflight.py:18's warning below 12 GiB free.
# The first real run measured 145 GB on / with 88 GB free, so that reason was wrong and is
# withdrawn: disk is not the binding constraint on this runner.
#
# What remains is wall clock. A desktop pulls a few thousand packages through apt inside
# the chroot, and the job's ceiling is a guess already. So a desktop derivative stays a
# maintainer-run build for now, on a measured cost rather than an imagined one -- and it
# is a candidate to add once the run's real duration is known.

# Default anyway (core/sanitize.py:12), stated because an image that ships the apt lists
# it was built with is the classic derivative leak, and a reference build should be
# readable as the shape to copy.
sanitize:
  apt_lists: true
