name: CI

on:
  push:
  pull_request:

# A push that supersedes an in-flight run cancels it instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is not decoration. tarfile's extraction filter defaults to
        # fully_trusted up to 3.13 and to data from 3.14 (PEP 706), so a matrix
        # stopping at 3.13 tested the opposite behaviour from a 3.14 workstation
        # -- which is why an archive escape stayed invisible locally.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The Qt binding is chosen by a try/except shim, so CI used to exercise
        # only PySide6 while the .deb and every developer venv run PyQt6.
        qt-binding: [gui, pyqt6]
    name: test (py${{ matrix.python-version }}, ${{ matrix.qt-binding }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install
        run: python -m pip install -e ".[dev,typer,${{ matrix.qt-binding }}]"
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        # On both legs of the matrix, which it could not be while distroforge/ui/qt.py
        # was a plain try/except shim: mypy is asymmetric about those, so the same tree
        # was clean with PyQt6 installed and had 35 "Incompatible import" errors with
        # PySide6 installed. This step was pinned to pyqt6 to stay green, and pinning it
        # hid something worse -- with PySide6 unresolvable, QMainWindow resolved to Any,
        # an Any base class makes every attribute access legal, and MainWindow was not
        # being checked at all. The shim now types against PyQt6 under TYPE_CHECKING and
        # keeps the fallback at runtime, so this result no longer depends on the binding.
        run: python -m mypy distroforge/
      - name: Test
        run: python -m pytest -q

  packaging-static:
    # Static packaging checks only: no package is built here. A build needs
    # privilege and minutes, and every gate below is meaningful without one.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian shellcheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Shellcheck the maintainer scripts
        run: make shellcheck
      - name: Compile the python3 payloads embedded in packaging scripts
        # The one class of packaging defect shellcheck cannot see: a python3 payload
        # inside a shell script is syntax-checked by nothing, and this package
        # shipped a broken one from 0.3.4-4 to 0.3.5-2.
        run: make maintainer-scripts
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Every pre-commit ratchet, over the whole tree
        # .pre-commit-config.yaml says its hooks run "at commit time" and nothing ever
        # made that true: `pre-commit install` is a per-clone action, .git/hooks holds no
        # pre-commit in a fresh checkout, and no job here called pre-commit. So all seven
        # ratchets -- each written against a defect this tree actually shipped -- guarded
        # nothing, and one had been failing on tests/test_qemu_lab.py since the firmware
        # selector landed without anything noticing.
        #
        # --all-files, not the diff: a run limited to changed files cannot report what is
        # already in the tree, which is exactly how that failure stayed invisible. Every
        # hook is repo: local with language: system, so no hook clones or pip-installs
        # anything; shellcheck comes from apt above and ruff from the editable install.
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files
      - name: Packaging and policy guards
        # Named explicitly so they cannot be lost in the noise of a full run, and
        # so a collection error here is not mistaken for an unrelated failure.
        run: |
          python -m pytest -q \
            tests/test_policy_compliance.py \
            tests/test_platform_contracts.py \
            tests/test_packaging_reports.py \
            tests/test_pillar_contracts.py \
            tests/test_maintainer_scripts.py
      - name: Lintian profile must be a vendor, and the vendor the package targets
        # lintian profiles are vendors, never suites, and an unpinned invocation makes
        # the verdict depend on whichever vendor the host happens to be. This was a grep
        # for the exact argument pair, which was worse than useless: the only thing it
        # ever matched was the comment explaining the rule, and it could not see the form
        # the code actually builds, where the flag and its value are two separate argv
        # strings. The check now lives in the suite, where it reads the resolver and the
        # suite names instead of guessing. It also covers the follow-up defect: pinning
        # "debian" for a package targeting an Ubuntu suite made lintian reject a correct
        # .changes Distribution field, and the tag-based verdict turned that into failed.
        run: |
          lintian --profile debian --version
          lintian --profile ubuntu --version
          python -m pytest -q tests/test_packaging_reports.py \
            -k "lintian_profile_is_a_vendor \
             or lintian_is_never_invoked \
             or profile_follows_the_targeted_suite \
             or resolves_to_the_vendor_it_actually_targets \
             or changelog_suite_reader"

  distro-dependencies:
    # The one job that answers "does it work with the Python and the libraries the
    # distribution ships", which the matrix above cannot: setup-python installs an
    # interpreter, while the package is built against the runner distribution's
    # python3 and its python3-* packages. Adding 3.14 to the matrix does not cover
    # this case.
    #
    # It runs in a container of the target suite, not on the runner image: the
    # runner is 24.04, whose python3-pydantic is 1.10 -- no field_validator, no
    # ConfigDict -- so every test module failed to import. That was not a false
    # alarm but a mislabelled one: the archive really is too old, and the missing
    # piece was the versioned dependency, now declared in debian/control. The
    # container is the suite debian/changelog targets.
    runs-on: ubuntu-latest
    container: ubuntu:devel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution packages only
        # Deliberately no ruff: it has no version in the Ubuntu archive
        # (apt-cache showpkg ruff lists the name with an empty Versions field),
        # so a Build-Depends on it would make the package unbuildable. The
        # one-statement-per-line guard is therefore implemented against ast
        # rather than delegated to ruff, and needs nothing installed.
        env:
          DEBIAN_FRONTEND: noninteractive
        #
        # zstd and xorriso are the two runtime Depends the suite really invokes -- a
        # snapshot test drives tar --zstd for real -- so leaving them out failed a
        # test for a missing tool rather than for a defect. debootstrap,
        # qemu-system-x86 and squashfs-tools are Depends the suite never invokes and
        # are deliberately absent here, which is why they left Build-Depends too.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-pydantic python3-yaml python3-pluggy \
            python3-rich python3-typer python3-pyqt6 libegl1 zstd xorriso passwd
      - name: Report what the distribution provides
        run: |
          python3 --version
          dpkg-query -W python3-pyqt6 python3-pydantic python3-pytest
      - name: The archive must satisfy the dependency debian/control declares
        # Named, so a suite too old to run the suite says so in one line instead of
        # failing every test module with an ImportError.
        run: |
          dpkg --compare-versions "$(dpkg-query -f '${Version}' -W python3-pydantic)" ge 2.7
      - name: Run the suite the way debian/rules does
        # As an unprivileged user, because that is what Rules-Requires-Root: no means:
        # dpkg-buildpackage never becomes root, so neither does the test phase. A
        # container defaults to root, and root defeats the tests that lock a directory
        # to 0500 and expect a PermissionError -- chmod answers to ownership, so root
        # writes it anyway. Those tests carry the `unprivileged` marker and skip under
        # root rather than failing, but skipping is not the point: running them is.
        env:
          DISTROFORGE_DEBIAN_BUILD: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          useradd --create-home --shell /bin/sh builder
          chown -R builder:builder .
          runuser -u builder -- env \
            HOME=/home/builder \
            DISTROFORGE_DEBIAN_BUILD=1 \
            QT_QPA_PLATFORM=offscreen \
            python3 -m pytest -q
