# git-buildpackage settings. distroforge doctor lists gbp as this package's release
# workflow, so these values are load-bearing rather than decorative. Until 2026-07-27
# two of them named things that have never existed in this repository, which is what
# happens to configuration that nothing ever runs.

[DEFAULT]
debian-branch = main

# Upstream and this packaging are one Git tree, so there is no separate branch holding
# upstream releases. This said "upstream" from the 0.3.5-1 baseline import onward -- a
# branch that has never existed here, so the first gbp command to resolve it would have
# failed. main is the tree that is upstream.
upstream-branch = main

# No pristine-tar branch either: the orig tarball is produced from the tree, as
# debian/README.source describes.
pristine-tar = False

# Pinned rather than inherited. It matches gbp 0.9.42's own default and DEP-14's name,
# but what a release tag is called is a contract here, for the same reason
# Rules-Requires-Root stays written out in debian/control: a contract must not depend on
# which version of the tool ran the command.
debian-tag = debian/%(version)s

# gbp's default is False and it does not defer to git: gbp/git/repository.py passes
# --no-sign when this is unset, overriding tag.gpgsign = true in the repository config.
# Leaving it out would have produced an unsigned release tag over commits that are all
# signed. Which key signs it is git's user.signingkey and is deliberately not repeated
# here -- gbp's keyid option would become a second place to change it.
sign-tags = True

[buildpackage]
# gbp's default is TAG, which sends export-orig looking for an upstream/<version> tag
# that this single-tree workflow never creates. The tarball comes from the branch above.
upstream-tree = BRANCH
